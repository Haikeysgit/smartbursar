name: Daily Fee Sweeper

on:
  schedule:
    # Runs at 07:00 UTC (8:00 AM Nigeria Time) every MONDAY
    - cron: '0 7 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  wake_up_and_sweep:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Wake Up The Server (The Knock)
        run: |
          echo "Knocking on the door to wake up Render..."
          # This request might fail if the server is sleeping, but that's okay. It starts the boot process.
          curl -I https://smartbursar-bot.onrender.com || true

      - name: 2. Wait for Boot (60 Seconds)
        run: |
          echo "Waiting 60 seconds for the server to fully wake up..."
          sleep 60

      - name: 3. Trigger The Reminder (The Real Shot)
        run: |
          echo "Server should be awake now. Sending the command!"
          # Now we send the real request with a longer timeout
          curl -X GET https://smartbursar-bot.onrender.com/trigger-template-reminders --max-time 300
