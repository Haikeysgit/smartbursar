name: Daily Fee Sweeper

on:
  schedule:
    # Runs at 07:00 UTC (8:00 AM Nigeria Time) every MONDAY
    - cron: '0 7 * * 1'
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  wake_up_and_sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger SmartBursar Reminder Endpoint
        run: |
          # 120s timeout allows Render to wake up from cold start
          curl -X GET https://smartbursar-bot.onrender.com/trigger-template-reminders --max-time 120
